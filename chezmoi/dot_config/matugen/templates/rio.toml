[colors]
background       = '{{ colors.surface.default.hex }}'
foreground       = '{{ colors.on_surface.default.hex }}'
cursor           = '{{ colors.on_surface.default.hex }}'
vi-cursor        = '{{ colors.primary.default.hex }}'

black            = '{{ colors.surface_variant.default.hex }}'
red              = '{{ colors.error.default.hex }}'
green            = '{{ colors.primary.default.hex }}'
yellow           = '{{ colors.secondary.default.hex }}'
blue             = '{{ colors.tertiary.default.hex }}'
magenta          = '{{ colors.primary_fixed_dim.default.hex }}'
cyan             = '{{ colors.secondary_fixed_dim.default.hex }}'
white            = '{{ colors.on_surface.default.hex }}'

dim-foreground   = '{{ colors.on_surface_variant.default.hex }}'
dim-black        = '{{ colors.surface_variant.default.hex }}'
dim-red          = '{{ colors.error.default.hex }}'
dim-green        = '{{ colors.primary.default.hex }}'
dim-yellow       = '{{ colors.secondary.default.hex }}'
dim-blue         = '{{ colors.tertiary.default.hex }}'
dim-magenta      = '{{ colors.primary_fixed_dim.default.hex }}'
dim-cyan         = '{{ colors.secondary_fixed_dim.default.hex }}'
dim-white        = '{{ colors.on_surface_variant.default.hex }}'

light-foreground = '{{ colors.on_surface.default.hex }}'
light-black      = '{{ colors.outline.default.hex }}'
light-red        = '{{ colors.error.default.hex }}'
light-green      = '{{ colors.primary.default.hex }}'
light-yellow     = '{{ colors.secondary.default.hex }}'
light-blue       = '{{ colors.tertiary.default.hex }}'
light-magenta    = '{{ colors.primary_fixed_dim.default.hex }}'
light-cyan       = '{{ colors.secondary_fixed_dim.default.hex }}'
light-white      = '{{ colors.on_surface.default.hex }}'

tabs             = '{{ colors.surface_variant.default.hex }}'
tabs-active      = '{{ colors.primary.default.hex }}'
bar              = '{{ colors.on_surface.default.hex }}'
split            = '{{ colors.surface_variant.default.hex }}'

# Search
search-match-background          = '{{ colors.tertiary.default.hex }}'
search-match-foreground          = '{{ colors.surface.default.hex }}'
search-focused-match-background  = '{{ colors.primary.default.hex }}'
search-focused-match-foreground  = '{{ colors.surface.default.hex }}'

# Hints
hint-foreground  = '{{ colors.surface.default.hex }}'
hint-background  = '{{ colors.secondary.default.hex }}'

# Selection
selection-foreground = '{{ colors.on_surface_variant.default.hex }}'
selection-background = '{{ colors.surface_variant.default.hex }}'
