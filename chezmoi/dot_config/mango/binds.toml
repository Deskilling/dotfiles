[bind.default]

"CTRL+ALT+SUPER+space" = "spawn,noctalia msg panel-toggle launcher"
"CTRL+ALT+SUPER+Return" = "spawn,rio"

"CTRL+ALT+SUPER+e" = "focusstack,next"
"CTRL+ALT+SUPER+q" = "focusstack,prev"
"CTRL+ALT+SUPER+z" = "setlayout,tile"
"CTRL+ALT+SUPER+f" = "set_proportion,1.0"
"CTRL+ALT+SUPER+d" = "set_proportion,0.5"

"CTRL+ALT+SUPER+Left" = "focusdir,left"
"CTRL+ALT+SUPER+Down" = "focusdir,down"
"CTRL+ALT+SUPER+Up" = "focusdir,up"
"CTRL+ALT+SUPER+Right" = "focusdir,right"

"CTRL+ALT+SUPER+j" = "move_client,left"
"CTRL+ALT+SUPER+k" = "move_client,down"
"CTRL+ALT+SUPER+i" = "move_client,up"
"CTRL+ALT+SUPER+l" = "move_client,right"

"CTRL+ALT+SUPER+x" = "togglefloating,"
"CTRL+ALT+SUPER+g" = "togglefullscreen,"
"ALT+F4" = "killclient,"

"CTRL+ALT+SUPER+1" = "view,1,0"
"CTRL+ALT+SUPER+2" = "view,2,0"
"CTRL+ALT+SUPER+3" = "view,3,0"
"CTRL+ALT+SUPER+4" = "view,4,0"
"CTRL+ALT+SUPER+5" = "view,5,0"
"CTRL+ALT+SUPER+6" = "view,6,0"
"CTRL+ALT+SUPER+7" = "view,7,0"
"CTRL+ALT+SUPER+SHIFT+1" = "tag,1,0"
"CTRL+ALT+SUPER+SHIFT+2" = "tag,2,0"
"CTRL+ALT+SUPER+SHIFT+3" = "tag,3,0"
"CTRL+ALT+SUPER+SHIFT+4" = "tag,4,0"
"CTRL+ALT+SUPER+SHIFT+5" = "tag,5,0"
"CTRL+ALT+SUPER+SHIFT+6" = "tag,6,0"
"CTRL+ALT+SUPER+SHIFT+7" = "tag,7,0"

"none+XF86AudioRaiseVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"none+XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"none+XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

[mousebind.default]

"CTRL+ALT+SUPER+btn_left" = "moveresize,curmove"
"CTRL+ALT+SUPER+btn_right" = "moveresize,curresize"
