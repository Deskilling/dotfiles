[var]
hyper = "CTRL+ALT+SUPER"

[bind.default]

"$hyper+space" = "spawn,rofi -show drun"
"$hyper+Return" = "spawn,rio"

"$hyper+SHIFT+Escape" = "quit"

"$hyper+e" = "focusstack,next"
"$hyper+q" = "focusstack,prev"
"$hyper+b" = "focuslast,"
"$hyper+Left" = "focus_window_or_workspace,left"
"$hyper+Down" = "focusdir,down"
"$hyper+Up" = "focusdir,up"
"$hyper+Right" = "focus_window_or_workspace,right"

"$hyper+j" = "move_client,left"
"$hyper+k" = "move_client,down"
"$hyper+i" = "move_client,up"
"$hyper+l" = "move_client,right"

"$hyper+c" = "switch_layout"
"$hyper+d" = "set_proportion,1.0"
"$hyper+s" = "set_proportion,0.5"

"$hyper+x" = "togglefloating,"
"$hyper+f" = "togglefullscreen,"
"$hyper+g" = "togglemaximizescreen,"
"$hyper+p" = "toggleglobal,"
"$hyper+m" = "minimized,"
"$hyper+SHIFT+m" = "restore_minimized,"

"$hyper+t" = "toggle_named_scratchpad,scratch-term,none,rio --app-id scratch-term"

"ALT+F4" = "killclient,"
"ALT+SHIFT+F4" = "killclient,force"

"ALT+Tab" = "switcher,all_tag_next"
"ALT+SHIFT+Tab" = "switcher,all_tag_prev"
"CTRL+SHIFT+Escape" = "spawn,missioncenter"
"$hyper+Tab" = "toggleoverview,"

"$hyper+1" = "view,1,0"
"$hyper+2" = "view,2,0"
"$hyper+3" = "view,3,0"
"$hyper+4" = "view,4,0"
"$hyper+5" = "view,5,0"
"$hyper+6" = "view,6,0"
"$hyper+7" = "view,7,0"
"$hyper+8" = "view,8,0"
"$hyper+9" = "view,9,0"

"$hyper+SHIFT+1" = "tag,1,0"
"$hyper+SHIFT+2" = "tag,2,0"
"$hyper+SHIFT+3" = "tag,3,0"
"$hyper+SHIFT+4" = "tag,4,0"
"$hyper+SHIFT+5" = "tag,5,0"
"$hyper+SHIFT+6" = "tag,6,0"
"$hyper+SHIFT+7" = "tag,7,0"
"$hyper+SHIFT+8" = "tag,8,0"
"$hyper+SHIFT+9" = "tag,9,0"

"Print" = "spawn_shell,grim -g \"$(slurp)\" - | wl-copy"

[bind.default.lock]
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86AudioPlay" = "spawn,playerctl play-pause"
"XF86AudioNext" = "spawn,playerctl next"
"XF86AudioPrev" = "spawn,playerctl previous"

[mousebind.default]
"$hyper+btn_left" = "moveresize,curmove"
"$hyper+btn_right" = "moveresize,curresize"

[gesturebind.default]
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"
"none+left+4" = "viewtoright_have_client"
"none+right+4" = "viewtoleft_have_client"
